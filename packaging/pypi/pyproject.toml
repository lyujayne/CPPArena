[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-arena"
version = "2.9"
description = "Desktop comparison platform for UAV coverage path planning algorithms"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "third_party/*"]
dependencies = [
    "PySide6>=6.5",
    "shapely>=2.0",
    "pyproj>=3.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "lxml>=4.9",
    "requests>=2.20",
    "Pillow>=9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Repository = "https://github.com/lyujayne/CPPArena"
Issues = "https://github.com/lyujayne/CPPArena/issues"

[project.scripts]
cpp-arena = "cpp_arena:main"
cpp-arena-history = "cpp_arena:history_main"

[tool.setuptools]
packages = ["cpp_arena"]
include-package-data = false

[tool.setuptools.package-data]
cpp_arena = ["application.zip"]
